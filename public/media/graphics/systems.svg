<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Distributed System Topology -->
  <!-- Center Router / Gateway Node -->
  <circle cx="60" cy="36" r="12" fill="#141419" stroke="url(#sysGrad)" stroke-width="1.8" />
  <circle cx="60" cy="36" r="4" fill="#34D399" />

  <!-- Connection Pathways to Worker Nodes -->
  <path d="M 60 48 L 32 80" stroke="#2D2D34" stroke-width="1.5" stroke-dasharray="3 3" />
  <path d="M 60 48 L 60 76" stroke="url(#sysGrad)" stroke-width="1.5" />
  <path d="M 60 48 L 88 80" stroke="#2D2D34" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Distributed Service Nodes -->
  <!-- Left Node -->
  <rect x="20" y="78" width="24" height="24" rx="2" fill="#141419" stroke="#2D2D34" stroke-width="1.5" />
  <circle cx="32" cy="90" r="3" fill="#5A5A64" />

  <!-- Center Node (Active Primary) -->
  <rect x="48" y="76" width="24" height="24" rx="2" fill="#141419" stroke="url(#sysGrad)" stroke-width="1.5" />
  <circle cx="60" cy="88" r="3" fill="#10B981" />

  <!-- Right Node -->
  <rect x="76" y="78" width="24" height="24" rx="2" fill="#141419" stroke="#2D2D34" stroke-width="1.5" />
  <circle cx="88" cy="90" r="3" fill="#5A5A64" />

  <!-- Inter-service Peer Sync Link -->
  <line x1="44" y1="88" x2="48" y2="88" stroke="#10B981" stroke-width="1" />
  <line x1="72" y1="88" x2="76" y2="88" stroke="#10B981" stroke-width="1" />
</svg>

