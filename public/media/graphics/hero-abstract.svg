<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="210" cy="160" r="140" fill="url(#heroGlow)" />

  <!-- Background Coordinate Crossbars -->
  <line x1="60" y1="160" x2="360" y2="160" stroke="#222227" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="210" y1="40" x2="210" y2="280" stroke="#222227" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Isometric Architectural Layers (Full-Stack & Systems) -->
  <!-- Layer 1: Base / Foundation -->
  <path d="M 110 210 L 210 250 L 310 210 L 210 170 Z" fill="#111114" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Layer 2: Logic & Execution -->
  <path d="M 110 160 L 210 200 L 310 160 L 210 120 Z" fill="#141419" stroke="#2D2D34" stroke-width="1.5" />
  
  <!-- Layer 3: Intelligence & Interface -->
  <path d="M 110 110 L 210 150 L 310 110 L 210 70 Z" fill="#18181F" stroke="url(#heroEmeraldGrad)" stroke-width="1.5" />

  <!-- Vertical Connectors between Layers -->
  <line x1="110" y1="110" x2="110" y2="210" stroke="#27272A" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="310" y1="110" x2="310" y2="210" stroke="#27272A" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="210" y1="70" x2="210" y2="170" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- The Central Theta Symbol on the Top Layer -->
  <circle cx="210" cy="110" r="20" fill="#09090B" stroke="url(#heroEmeraldGrad)" stroke-width="2.5" />
  <line x1="194" y1="110" x2="226" y2="110" stroke="url(#heroEmeraldGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Satellite Nodes & Data Points -->
  <circle cx="160" cy="85" r="3" fill="#FAFAFA" />
  <circle cx="260" cy="135" r="3" fill="#34D399" />
  <circle cx="280" cy="90" r="2.5" fill="#5A5A64" />
  <circle cx="140" cy="135" r="2.5" fill="#5A5A64" />

  <!-- Subtle Label Tags -->
  <text x="210" y="278" font-family="ui-monospace, monospace" font-size="10" fill="#71717A" text-anchor="middle" letter-spacing="1">FOUNDATIONS → INTELLIGENCE</text>
</svg>

