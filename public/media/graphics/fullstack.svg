<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Full-Stack Stack (Client -> API -> Database) -->
  <!-- Top: Client Viewport -->
  <rect x="24" y="20" width="72" height="22" rx="2" fill="#141419" stroke="#2D2D34" stroke-width="1.5" />
  <circle cx="34" cy="31" r="2.5" fill="#10B981" />
  <line x1="44" y1="31" x2="84" y2="31" stroke="#3E3E48" stroke-width="1.5" stroke-linecap="round" />

  <!-- Connector Down -->
  <line x1="60" y1="42" x2="60" y2="52" stroke="url(#fsGrad)" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Middle: Application Core / Logic -->
  <rect x="24" y="52" width="72" height="22" rx="2" fill="#141419" stroke="url(#fsGrad)" stroke-width="1.5" />
  <polyline points="40,63 47,59 47,67" stroke="#FAFAFA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="56" y1="63" x2="80" y2="63" stroke="#FAFAFA" stroke-width="1.5" stroke-linecap="round" />

  <!-- Connector Down -->
  <line x1="60" y1="74" x2="60" y2="84" stroke="url(#fsGrad)" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Bottom: Data Storage / Database Cylinders -->
  <rect x="24" y="84" width="72" height="22" rx="2" fill="#141419" stroke="#2D2D34" stroke-width="1.5" />
  <path d="M 38 91 C 38 88, 50 88, 60 88 C 70 88, 82 88, 82 91" stroke="#5A5A64" stroke-width="1.2" fill="none" />
  <path d="M 38 97 C 38 100, 50 100, 60 100 C 70 100, 82 100, 82 97" stroke="#10B981" stroke-width="1.2" fill="none" />
</svg>

